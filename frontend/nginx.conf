server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location /products {
        proxy_pass http://product-service:8000;
    }
    location /internal {
        proxy_pass http://product-service:8000;
    }
    location /cart {
        proxy_pass http://order-service:8001;
    }
    location /orders {
        proxy_pass http://order-service:8001;
    }

    location / {
        try_files $uri /index.html;
    }
}
