version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: postgres_db
    restart: always

    environment:
      POSTGRES_DB: shop_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Vanya2020)

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  product-service:
    build: ./product_service
    container_name: product_service

    ports:
      - "8001:8001"

    depends_on:
      postgres:
        condition: service_healthy

    restart: always

  order-service:
    build: ./order_service
    container_name: order_service

    ports:
      - "8002:8002"

    depends_on:
      postgres:
        condition: service_healthy

    restart: always

  gateway:
    build: ./gateway
    container_name: gateway

    ports:
      - "8080:8080"

    depends_on:
      - product-service
      - order-service

    restart: always

  frontend:
    build: ./frontend
    container_name: frontend

    ports:
      - "80:80"

    depends_on:
      - gateway

    restart: always

volumes:
  pgdata: