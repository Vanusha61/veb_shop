server {
    listen 8080;
    server_name localhost;

    # Product Service Swagger
    location /product-service/ {
        proxy_pass http://product-service:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Order Service Swagger
    location /order-service/ {
        proxy_pass http://order-service:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Главная страница со ссылками на оба Swagger
    location = / {
        return 200 '<!DOCTYPE html>
<html>
<head><title>Shop Microservices</title></head>
<body>
<h1>Shop Microservices</h1>
<ul>
<li><a href="/product-service/docs">Product Service API</a></li>
<li><a href="/order-service/docs">Order Service API</a></li>
</ul>
</body>
</html>';
        add_header Content-Type text/html;
    }
}
