server {
    listen 80;

    location /api/ {
        proxy_pass http://auth-service:8003/;
        proxy_set_header Host $host;
    }

    location /api/products {
        proxy_pass http://product-service:8001/products;
        proxy_set_header Host $host;
    }

    location /api/orders {
        proxy_pass http://order-service:8002/orders;
        proxy_set_header Host $host;
    }

    location /api/admin/ {
        proxy_pass http://order-service:8002/admin/;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
    }

    location /admin/ {
        proxy_pass http://admin-frontend:3000/;
        proxy_set_header Host $host;
    }
}
